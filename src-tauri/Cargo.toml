[package]
name = "lookmd"
version = "1.0.1"
description = "Local WYSIWYG Markdown editor"
authors = ["LookMD"]
repository = "https://github.com/promise-zb/look-md.git"
edition = "2021"

[lib]
name = "lookmd_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
