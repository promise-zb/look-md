[package]
name = "lookmd"
version = "1.0.0"
description = "Local WYSIWYG Markdown editor"
authors = ["LookMD"]
repository = "https://github.com/promise-zb/look-md.git"
edition = "2021"

[lib]
name = "lookmd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
